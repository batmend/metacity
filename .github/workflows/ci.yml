name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Bundle size report
        run: |
          echo '### Bundle (gzip)' >> "$GITHUB_STEP_SUMMARY"
          for f in apps/web/dist/assets/*.js apps/web/dist/assets/*.css; do
            printf -- '- %s: %s KB\n' "$(basename "$f")" "$(gzip -c "$f" | wc -c | awk '{printf "%.0f", $1/1024}')" >> "$GITHUB_STEP_SUMMARY"
          done
          printf -- '- ub-demo.pmtiles: %s KB\n' "$(stat -c %s apps/web/public/tiles/ub-demo.pmtiles | awk '{printf "%.0f", $1/1024}')" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
