name: Deploy to GitHub Pages
on:
  push:
    branches: [main, claude/vibrant-cerf-5zhiya]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Demo tiles + style
        run: pnpm tiles:demo && pnpm style:build
      - name: Use real OSM tiles when the data-latest release exists
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/data-latest"
          if curl -fsSL -o apps/web/public/tiles/ub.pmtiles "$base/ub.pmtiles"; then
            curl -fsSL -o apps/web/public/data/search-index.json "$base/search-index.json"
            curl -fsSL -o apps/web/public/data/tiles-meta.json "$base/tiles-meta.json"
            echo "VITE_TILES=tiles/ub.pmtiles" >> "$GITHUB_ENV"
            echo "OSM tiles: $(stat -c %s apps/web/public/tiles/ub.pmtiles) bytes"
          else
            echo "data-latest release алга — демо seed ашиглана"
          fi
      - name: Build web (base = /<repo>/)
        run: BASE_PATH="/${GITHUB_REPOSITORY#*/}/" pnpm --filter @metacity/web build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
